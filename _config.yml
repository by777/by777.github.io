title: 白柒的博客
email: 1373953675@qq.com
description: > # this means to ignore newlines until "baseurl:"
  Write an awesome description for your new site here. You can edit this
  line in _config.yml. It will appear in your document head meta (for
  Google search results) and in your feed.xml site description.
permalink: ':title/'
baseurl: "/" # the subpath of your site, e.g. /blog
url: "https://by777.github.io" # the base hostname & protocol for your site

# Author settings
author: Bai Qi # add your name
author-pic: avatar.svg
about-author: "/dev/brain -- stdout: C++, Python, DSP, 图像处理, 造轮子爱好者"

# Contact links
email: 1373953675@qq.com
phone: # Add your Phone number
website: by777.github.io # Add your website, do not add http://
linkedin: # Add your Linkedin handle
github: by777 # by777
twitter: # Add your Twitter handle (without @)
#facebook: # Add your Facebook handle
#instagram: # Add your Instagram handle
#pinterest: # Add your Pinterest handle

# Newsletter
mailchimp: # Add your MailChimp form identifier.

# Disqus
discus_identifier: # mr-brown — disabled, add your own Disqus ID here

# Tracker
analytics: # Google Analytics

# Paginate
paginate: 24
paginate_path: /page:num/

# Build settings
markdown: kramdown
plugins:
  - jekyll-paginate
  - jekyll-feed
  - jekyll-sitemap

include: [_pages]
exclude: ["node_modules", "gulpfile.js", "package.json", "yarn.lock"]

collections:
  runoob:
    output: true
    permalink: /runoob/:title/

defaults:
  - scope:
      path: ""
      type: runoob
    values:
      layout: post
